<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'" />
    <title>Demo script</title>
    <style>
      html, body { margin: 0; height: 100%; background: #142024; color: #F3F6F4; font: 20px/1.45 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
      .wrap { display: grid; grid-template-columns: 1fr auto; gap: 24px; padding: 14px 24px; height: 100%; box-sizing: border-box; }
      .part { font-size: 15px; letter-spacing: .04em; text-transform: uppercase; color: #9fb4ae; margin-bottom: 6px; }
      .say { font-size: 27px; line-height: 1.35; margin: 0 0 6px; }
      .say::before { content: 'SAY  '; font-size: 13px; color: #9fb4ae; letter-spacing: .08em; vertical-align: middle; }
      .act { font-size: 20px; color: #142024; background: #E0A100; display: inline-block; padding: 4px 12px; border-radius: 6px; margin: 2px 0 6px; font-weight: 600; }
      .act::before { content: 'DO  '; font-size: 12px; letter-spacing: .08em; }
      .rec { text-align: right; display: grid; align-content: start; gap: 8px; min-width: 210px; }
      .dot { color: #ff5b4f; font-weight: 700; font-size: 20px; }
      .idle { color: #9fb4ae; font-size: 16px; }
      .path { font-size: 12px; color: #9fb4ae; max-width: 260px; word-break: break-all; }
      .err { color: #ffb4ab; font-size: 14px; max-width: 260px; }
      button { font: inherit; font-size: 15px; padding: 6px 14px; border-radius: 999px; border: 2px solid #F3F6F4; background: transparent; color: #F3F6F4; cursor: pointer; }
      .note { font-size: 12px; color: #6f8a83; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div>
        <div class="part" id="part">Demo</div>
        <p class="say" id="say" hidden></p>
        <div class="act" id="act" hidden></div>
        <p class="say" id="then" hidden></p>
      </div>
      <div class="rec">
        <span id="status" class="idle">Recording starts…</span>
        <button id="stop" hidden>Stop recording</button>
        <span class="path" id="path"></span>
        <span class="err" id="err"></span>
        <span class="note">This window is not recorded.</span>
      </div>
    </div>
    <script type="module" src="./prompter.ts"></script>
  </body>
</html>
